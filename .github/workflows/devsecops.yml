name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt coverage

      - name: Run unit tests with coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report -m

      - name: Quality Gate - minimum coverage 70%
        run: coverage report --fail-under=70

  sast-scan:
    name: SAST Scan (Bandit) + Quality Gate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit (tanpa menggagalkan job)
        run: bandit -r app run.py -f json -o bandit-report.json --exit-zero

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Quality Gate - evaluasi temuan keamanan
        run: python scripts/quality_gate.py